<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <!-- Định nghĩa màu gradient và hiệu ứng đổ bóng -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfaf5"/>
      <stop offset="100%" stop-color="#f2e8d5"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b261d"/>
      <stop offset="100%" stop-color="#5a1510"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Nền Poster (Màu giấy cổ) -->
  <rect width="800" height="1200" fill="url(#bg-grad)"/>
  
  <!-- Khung viền trang trí -->
  <rect x="20" y="20" width="760" height="1160" fill="none" stroke="#c59b27" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="1140" fill="none" stroke="#8b261d" stroke-width="6"/>

  <!-- Phần Header (Khối tiêu đề chính) -->
  <rect x="30" y="30" width="740" height="280" fill="url(#header-grad)"/>
  
  <!-- Họa tiết vòng tròn mờ trang trí Header -->
  <circle cx="400" cy="170" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="400" cy="170" r="100" fill="#ffffff" opacity="0.05"/>

  <!-- Chữ Tiêu đề -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#c59b27" text-anchor="middle" letter-spacing="3">BẾN NHÀ RỒNG - DẤU ẤN LỊCH SỬ</text>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TUYẾN KHÁM PHÁ</text>
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fdfaf5" text-anchor="middle">KIẾN TRÚC &amp; DI SẢN</text>

  <!-- Huy hiệu thời lượng -->
  <rect x="280" y="265" width="240" height="36" rx="18" fill="#c59b27"/>
  <text x="400" y="289" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2b1816" text-anchor="middle">HÀNH TRÌNH 90 PHÚT</text>

  <!-- Đường dẫn gạch nối các điểm tham quan -->
  <path d="M 160 420 L 160 930" fill="none" stroke="#c59b27" stroke-width="4" stroke-dasharray="8,8"/>

  <!-- ĐIỂM 1: Quảng Trường -->
  <g filter="url(#shadow)">
    <rect x="120" y="360" width="560" height="130" rx="12" fill="#ffffff"/>
  </g>
  <circle cx="160" cy="425" r="35" fill="#8b261d"/>
  <text x="160" y="438" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="220" y="405" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#8b261d">Quảng Trường &amp; Tượng Đài</text>
  <text x="220" y="435" font-family="Arial, sans-serif" font-size="18" fill="#555555">Quan sát trục đối xứng mặt đứng tòa nhà từ xa</text>
  <text x="220" y="460" font-family="Arial, sans-serif" font-size="18" fill="#555555">và khuôn viên tượng đài Nguyễn Tất Thành.</text>

  <!-- ĐIỂM 2: Đôi Rồng -->
  <g filter="url(#shadow)">
    <rect x="120" y="520" width="560" height="130" rx="12" fill="#ffffff"/>
  </g>
  <circle cx="160" cy="585" r="35" fill="#c59b27"/>
  <text x="160" y="598" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="220" y="565" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#8b261d">Đôi Rồng "Lưỡng Long Chầu Nguyệt"</text>
  <text x="220" y="595" font-family="Arial, sans-serif" font-size="18" fill="#555555">Chiêm ngưỡng kiến trúc mái ngói đỏ kiểu Pháp</text>
  <text x="220" y="620" font-family="Arial, sans-serif" font-size="18" fill="#555555">kết hợp biểu tượng rồng gốm men xanh Á Đông.</text>

  <!-- ĐIỂM 3: Hành Lang -->
  <g filter="url(#shadow)">
    <rect x="120" y="680" width="560" height="130" rx="12" fill="#ffffff"/>
  </g>
  <circle cx="160" cy="745" r="35" fill="#8b261d"/>
  <text x="160" y="758" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="220" y="725" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#8b261d">Hành Lang Vòm Cuốn Cổ Điển</text>
  <text x="220" y="755" font-family="Arial, sans-serif" font-size="18" fill="#555555">Trải nghiệm hệ thống thông gió tự nhiên với</text>
  <text x="220" y="780" font-family="Arial, sans-serif" font-size="18" fill="#555555">các dãy cột trụ và hệ cửa chớp lá sách cổ.</text>

  <!-- ĐIỂM 4: Không Gian Trưng Bày -->
  <g filter="url(#shadow)">
    <rect x="120" y="840" width="560" height="130" rx="12" fill="#ffffff"/>
  </g>
  <circle cx="160" cy="905" r="35" fill="#c59b27"/>
  <text x="160" y="918" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="220" y="885" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#8b261d">Hệ Thống 9 Phòng Trưng Bày</text>
  <text x="220" y="915" font-family="Arial, sans-serif" font-size="18" fill="#555555">Khám phá tư liệu chuyên đề và mô hình tàu</text>
  <text x="220" y="940" font-family="Arial, sans-serif" font-size="18" fill="#555555">Amiral Latouche-Tréville lịch sử.</text>

  <!-- Phần Footer Poster -->
  <rect x="30" y="1030" width="740" height="140" fill="#2b1816"/>
  <text x="400" y="1075" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c59b27" text-anchor="middle">ĐỊA ĐIỂM: SỐ 01 NGUYỄN TẤT THÀNH, QUẬN 4, TP.HCM</text>
  <text x="400" y="1110" font-family="Arial, sans-serif" font-size="18" fill="#fdfaf5" text-anchor="middle">Mở cửa: Thứ Ba – Chủ Nhật (07:30 – 11:30 &amp; 13:30 – 17:00)</text>
  <text x="400" y="1140" font-family="Arial, sans-serif" font-size="16" fill="#888888" text-anchor="middle">Tìm hiểu thêm thông tin chi tiết và thư viện hình ảnh tại Website</text>
</svg>
